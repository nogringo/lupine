[package]
name = "lupine-core"
description = "Lupine protocol, crypto and content pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
bech32.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
focaccia.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
hkdf.workspace = true
hmac.workspace = true
nostr = { workspace = true, features = ["nip46", "nip59"] }
nostr-connect.workspace = true
nostr-sdk.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
unicode-normalization.workspace = true
web-time.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nostr-sdk = { workspace = true, features = ["aws_lc_rs", "rustls-tls-native-roots"] }
reqwest = { workspace = true, features = ["rustls", "http2", "system-proxy"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
tokio = { workspace = true, features = ["rt", "fs", "io-util", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
gloo-timers.workspace = true
send_wrapper.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

[dev-dependencies]
axum.workspace = true
nostr = { workspace = true, features = ["nip59"] }
nostr-database.workspace = true
nostr-memory.workspace = true
nostr-sdk = { workspace = true, features = ["local-relay"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
