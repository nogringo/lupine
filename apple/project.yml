name: Lupine
options:
  bundleIdPrefix: ovh.uid
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 936HBZB935
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_ID: $(DEVELOPMENT_TEAM).ovh.uid.lupine
    KEYCHAIN_GROUP_ID: $(DEVELOPMENT_TEAM).ovh.uid.lupine
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LupineCore:
    path: LupineCore

targets:
  Lupine:
    type: application
    platform: macOS
    sources: [Lupine, Shared]
    dependencies:
      - package: LupineCore
      - target: LupineFileProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ovh.uid.lupine
    info:
      path: Lupine/Info.plist
      properties:
        CFBundleDisplayName: Lupine
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        LupineAppGroup: $(APP_GROUP_ID)
        LupineKeychainGroup: $(KEYCHAIN_GROUP_ID)
    entitlements:
      path: Lupine/Lupine.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(KEYCHAIN_GROUP_ID)]
        # Folder sync: folders picked by the user, remembered across launches.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true

  LupineFileProvider:
    type: app-extension
    platform: macOS
    sources: [LupineFileProvider, Shared]
    dependencies:
      - package: LupineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ovh.uid.lupine.FileProvider
    info:
      path: LupineFileProvider/Info.plist
      properties:
        CFBundleDisplayName: Lupine
        LupineAppGroup: $(APP_GROUP_ID)
        LupineKeychainGroup: $(KEYCHAIN_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(APP_GROUP_ID)
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      path: LupineFileProvider/LupineFileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(KEYCHAIN_GROUP_ID)]
