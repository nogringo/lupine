[workspace]
resolver = "3"
members = ["crates/lupine-core", "crates/lupine-ffi", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/nogringo/lupine"

[workspace.dependencies]
lupine-core = { path = "crates/lupine-core" }

base64 = "0.23"
bytes = "1"
chacha20poly1305 = "0.11"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
nostr = { version = "0.45", default-features = false, features = ["std", "nip44", "os-rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
unicode-normalization = "0.1"
uniffi = "0.32"
zeroize = { version = "1", features = ["derive"] }

# Crypto is unusably slow at opt-level 0, even in tests.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
